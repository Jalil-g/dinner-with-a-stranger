services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dws
      POSTGRES_PASSWORD: dws
      POSTGRES_DB: dws
    ports:
      - "5433:5432" # host 5433 -> container 5432
    volumes:
      # Named volume managed by Docker, so database files never end up in the repo
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
